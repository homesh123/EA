<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Path Finder — Career Consultation</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg"></div>
  <main class="container">
    <header class="hero">
      <span class="badge">AI Career Transition</span>
      <h1>Find Your AI Path</h1>
      <p class="subtitle">
        Answer a short questionnaire and we'll recommend the AI role, skills, and learning
        roadmap that best match your current experience and goals.
      </p>
      <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
      <p class="step-counter"><span id="currentStep">1</span> / <span id="totalSteps">0</span></p>
    </header>

    <section id="form" class="card"></section>

    <footer class="footer">
      <p>This is a guidance tool, not a job guarantee. Use it to focus your learning.</p>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
